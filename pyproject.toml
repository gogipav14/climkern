[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climkern-retune"
version = "0.1.0"
description = "NIPALS-PLS Tunable Radiative Kernels for Climate Feedback Analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ClimKern-Retune Contributors"}
]
keywords = [
    "climate",
    "radiative kernels",
    "PLS",
    "NIPALS",
    "climate feedbacks",
    "machine learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "xarray>=0.19",
    "netCDF4>=1.5",
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "cartopy>=0.20",
    "dask>=2021.10",
    "open_nipals @ git+https://github.com/gogipav14/open_nipals.git",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=2.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
]

[project.urls]
Homepage = "https://github.com/gogipav14/ClimKern-Retune"
Documentation = "https://climkern-retune.readthedocs.io"
Repository = "https://github.com/gogipav14/ClimKern-Retune"

[tool.setuptools.packages.find]
where = ["."]
include = ["climkern*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "climkern/tests", "climkern_retune/tests"]
python_files = "test_*.py"
addopts = "-v --cov=climkern_retune --cov-report=term-missing"
